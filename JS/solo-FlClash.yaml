# FlClash 自定义配置测试模板：导入后在外部资源中添加机场节点来源。
# 导入会替换现有自定义配置，请先备份并新建测试配置。
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
ipv6: true
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
dns:
  enable: true
  respect-rules: true
  ipv6: true
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 2400:3200::1
  nameserver:
  - https://dns.cloudflare.com/dns-query
  - https://dns.google/dns-query
  proxy-server-nameserver-policy: null
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    dns.cloudflare.com:
    - 1.1.1.1
    - 1.0.0.1
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    geosite:cn:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
  - https://anycast.uncensoreddns.org/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 127.0.0.0/8
    - 0.0.0.0/32
  fake-ip-filter:
  - geosite:cn
  - '*.lan'
  - '*.local'
  - localhost
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - '*.msidentity.com'
  - captive.apple.com
  - '*.push.apple.com'
  - stun.*
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - speedtest.net
profile:
  store-selected: true
  store-fake-ip: true
proxy-groups:
- name: 🔘 PROXY-Gate
  type: select
  proxies:
  - 🌍 Global-Auto
  - 🖥️ All-Nodes
  - DIRECT
- name: 🖥️ All-Nodes
  type: select
  include-all-providers: true
  proxies:
  - DIRECT
- name: 🌍 Global-Auto
  type: url-test
  include-all-providers: true
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 50
- name: YouTube
